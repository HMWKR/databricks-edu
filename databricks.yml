# This is a Declarative Automation Bundle definition for databricks_free_demo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_free_demo
  uuid: a46bc6c4-f616-4d10-a8e7-a19696350310

# run_as:
#   service_principal_name: '5cf3z04b-a73c-4x46-9f3d-52da7999069e' 
# 실행하는 sp의 id를 사용하여 직접적으로 run을 할 sp 계정을 지정 할 수 있음. 
include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-8d1b8955-b21c.cloud.databricks.com
      profile: DEFAULT
    run_as:
      service_principal_name: 91ce7ec1-6278-4597-97b6-71e584207a81
  prod:
    mode: production
    workspace:  
      host: https://dbc-f20c16c0-9020.cloud.databricks.com
      profile: PROD_SP
      # We explicitly deploy to /Workspace/Users/dltysl123@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: 4ff26f51-cc41-475d-a2c6-8fe661212acb
    variables:
      catalog: workspace
      schema: default
    permissions:
      #- user_name: dltysl123@gmail.com ## 외부 prod 워크스페이스에 생성되는 번들 리소스를  이사용자도 관리 할 수 있게 한다라는 뜻 즉, SP 자체에 배포를 할 수 잇게끔 하는게 아니라 관리만 가능하게끔 하는 것 
      #  level: CAN_MANAGE
      - service_principal_name: 4ff26f51-cc41-475d-a2c6-8fe661212acb
        level: CAN_MANAGE
